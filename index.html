<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habitr</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav"><span class="logo">Habitr<span class="dot">.</span></span></nav>
<main>
<h1>Your habits</h1>
<p class="label sub"><i class="glow" id="glow"></i><span id="sum">Add a habit to start</span></p>
<div class="progress-track"><div class="progress-fill" id="bar"></div></div>
<div class="add">
<input id="new" type="text" placeholder="New habit, e.g. Drink water" maxlength="60" aria-label="New habit name">
<button class="btn" id="addBtn">Add habit</button>
</div>
<div id="list"></div>
</main>
<script src="app.js"></script>
</body>
</html>
